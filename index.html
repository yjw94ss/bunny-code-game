<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小兔子采萝卜 · 编程闯关</title>
<style>
  :root{
    --ink:#26343f;
    --ink-soft:#5d7284;
    --card:#ffffff;
    --shadow:0 16px 40px rgba(41,98,160,.14), 0 2px 6px rgba(41,98,160,.06);
    --blue:#3b82f6;
    --blue-d:#2563eb;
    --orange:#f59e0b;
    --orange-d:#d97706;
    --purple:#8b5cf6;
    --purple-d:#7c3aed;
    --green:#37b24d;
    --green-d:#2b9a3f;
    --radius:28px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Yuanti SC","Yuanti TC","STYuanti","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 600px at 8% -10%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(900px 500px at 100% 0%, #ffe9c9 0%, rgba(255,233,201,0) 60%),
      linear-gradient(165deg,#dff2ff 0%,#e9fbf1 48%,#fff7e8 100%);
    min-height:100%;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  /* 背景装饰 */
  .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .cloud{position:absolute;background:#fff;border-radius:100px;opacity:.75;filter:blur(.3px);animation:drift 34s linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud.c1{width:150px;height:52px;left:-180px;top:8%}
  .cloud.c1::before{width:70px;height:70px;left:22px;top:-30px}
  .cloud.c1::after{width:52px;height:52px;left:82px;top:-20px}
  .cloud.c2{width:110px;height:40px;left:-140px;top:22%;animation-duration:46s;animation-delay:-8s;opacity:.6}
  .cloud.c2::before{width:54px;height:54px;left:16px;top:-24px}
  .cloud.c2::after{width:38px;height:38px;left:62px;top:-14px}
  .cloud.c3{width:130px;height:44px;left:-160px;top:70%;animation-duration:58s;animation-delay:-20s;opacity:.5}
  .cloud.c3::before{width:60px;height:60px;left:20px;top:-26px}
  .cloud.c3::after{width:44px;height:44px;left:70px;top:-16px}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 320px))}}

  .app{position:relative;z-index:1;width:100%;max-width:1240px;margin:0 auto;padding:16px 18px 24px}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:.5px}
  .brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(160deg,#ffd66b,#ff9f43);display:grid;place-items:center;box-shadow:0 8px 18px rgba(255,159,67,.35)}
  .brand .logo svg{width:26px;height:26px}
  .dots{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .dot{
    width:30px;height:30px;border-radius:11px;border:none;cursor:pointer;
    background:#ffffff;color:#9db0c0;font-weight:800;font-size:13px;font-family:inherit;
    box-shadow:0 3px 0 #d9e4ee; transition:transform .15s, box-shadow .15s, background .2s, color .2s;
  }
  .dot.done{background:#d8f5df;color:#2b9a3f;box-shadow:0 3px 0 #b6e8c3}
  .dot.cur{background:linear-gradient(160deg,#5cc8ff,#3b82f6);color:#fff;box-shadow:0 4px 0 #2b6fd6;transform:translateY(-2px)}
  .dot.lock{opacity:.55;cursor:not-allowed}
  .icon-btn{
    width:44px;height:44px;border-radius:15px;border:none;cursor:pointer;background:#fff;
    display:grid;place-items:center;box-shadow:0 4px 0 #dbe6f0;transition:transform .12s,box-shadow .12s;color:#4a90d9
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe6f0}
  .icon-btn svg{width:22px;height:22px}
  .icon-btn.muted{color:#b9c7d4}

  /* 布局 */
  .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.66fr);gap:18px;align-items:stretch}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* 舞台 */
  .stage{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
  .stage-head{display:flex;align-items:center;gap:10px}
  .lv-badge{background:linear-gradient(160deg,#a7e3ff,#5bb8f5);color:#0d4a75;font-weight:800;font-size:14px;padding:7px 14px;border-radius:12px;box-shadow:0 3px 0 #bfe2f7}
  .lv-tip{font-size:14px;color:var(--ink-soft);font-weight:600;line-height:1.35}
  .board-holder{position:relative;margin:0 auto;width:100%;display:flex;justify-content:center}
  #board{width:100%;height:100%;display:block;border-radius:22px;filter:drop-shadow(0 10px 18px rgba(63,116,180,.16))}
  #bunnyPos{transition:transform .33s cubic-bezier(.34,1.25,.5,1);transform-box:view-box;transform-origin:0 0}
  #bunnyRot{transition:transform .28s ease;transform-box:fill-box;transform-origin:50% 50%}
  .bunnyBody{animation:hop 2.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translate(0,7px) scale(1.1)}50%{transform:translate(0,4px) scale(1.1)}}
  .carrot{transition:transform .15s}
  .carrot.eaten{animation:eat .4s ease forwards}
  @keyframes eat{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(0);opacity:0}}
  .stage-foot{display:flex;align-items:center;gap:12px;padding:2px 4px 0}
  .cnt{display:inline-flex;align-items:center;gap:6px;background:#fff4e2;border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;color:#a9601a}
  .cnt svg{width:17px;height:17px}
  .cnt b{font-size:16px}
  .cnt.all{background:#e6f9ec;color:#218739}
  .foot-note{margin-left:auto;font-size:13px;color:#9aabb9;font-weight:600}

  /* 抖动 / 撞墙 */
  .shake{animation:shake .42s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-9px) rotate(-.7deg)}
    35%{transform:translateX(8px) rotate(.7deg)}
    55%{transform:translateX(-6px)}
    75%{transform:translateX(4px)}
  }

  /* 面板 */
  .panel{padding:16px;display:flex;flex-direction:column;gap:10px;height:100%}
  .sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#43606f}
  .sec .num{background:#eef6ff;color:#4383c9;border-radius:9px;padding:3px 9px;font-size:13px}
  .sec .right{margin-left:auto;font-weight:700;color:#9fb0bd;font-size:13px}

  .program{
    flex:1 1 auto;min-height:150px;max-height:340px;overflow:auto;border-radius:20px;
    background:linear-gradient(180deg,#f7fbff,#eef6fd);
    border:3px dashed #cfe4f5;
    padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
    transition:border-color .2s, background .2s;
  }
  .program.filled{border-style:solid;border-color:#d7e9f8}
  .empty-hint{
    width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:#a8bccb;font-weight:700;font-size:14px;padding:26px 10px;text-align:center;line-height:1.5
  }
  .empty-hint svg{width:40px;height:40px;opacity:.85}
  .empty-hint .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .blk{
    position:relative;width:52px;height:52px;border-radius:15px;border:none;cursor:pointer;
    display:grid;place-items:center;color:#fff;font-family:inherit;
    animation:pop-in .22s cubic-bezier(.2,1.5,.5,1);
    box-shadow:0 4px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .12s, box-shadow .12s;
  }
  .blk svg{width:26px;height:26px}
  .blk .i{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:7px;background:#fff;color:#5b7385;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.12)}
  .blk:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .blk.move{background:linear-gradient(160deg,#66b3ff,var(--blue))}
  .blk.turn{background:linear-gradient(160deg,#ffc55c,var(--orange))}
  .blk.jump{background:linear-gradient(160deg,#b39bff,var(--purple))}
  .blk.active{outline:4px solid #ffd166;outline-offset:2px;transform:translateY(-3px) scale(1.06)}
  @keyframes pop-in{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  .palette{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .pbtn{
    border:none;cursor:pointer;font-family:inherit;border-radius:19px;padding:10px 4px 8px;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 6px 0 rgba(0,0,0,.16), inset 0 2px 0 rgba(255,255,255,.35);
    transition:transform .1s, box-shadow .1s, filter .2s;
  }
  .pbtn svg{width:30px;height:30px}
  .pbtn span{font-size:12px;font-weight:800;letter-spacing:.5px;text-shadow:0 1px 0 rgba(0,0,0,.12)}
  .pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  .pbtn.move{background:linear-gradient(160deg,#66b3ff,var(--blue))}
  .pbtn.turn{background:linear-gradient(160deg,#ffc55c,var(--orange))}
  .pbtn.jump{background:linear-gradient(160deg,#b39bff,var(--purple))}
  .pbtn:disabled{filter:grayscale(.7) opacity(.5);cursor:not-allowed;transform:none}

  .actions{display:grid;grid-template-columns:1.6fr .9fr .9fr;gap:9px;margin-top:auto;padding-top:4px}
  .btn{
    border:none;cursor:pointer;font-family:inherit;border-radius:18px;font-weight:800;color:#fff;
    padding:14px 8px;font-size:16px;letter-spacing:1px;
    box-shadow:0 6px 0 rgba(0,0,0,.16), inset 0 2px 0 rgba(255,255,255,.3);
    transition:transform .1s, box-shadow .1s, filter .2s;
  }
  .btn svg{width:20px;height:20px;vertical-align:-3px;margin-right:4px}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
  .btn.run{background:linear-gradient(160deg,#61d47a,var(--green))}
  .btn.run.pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 0 #2b9a3f, inset 0 2px 0 rgba(255,255,255,.3), 0 0 0 0 rgba(55,178,77,.35)}50%{box-shadow:0 6px 0 #2b9a3f, inset 0 2px 0 rgba(255,255,255,.3), 0 0 0 12px rgba(55,178,77,0)}}
  .btn.ghost{background:linear-gradient(160deg,#dfeaf4,#c9dbe9);color:#4b6a80;font-size:14px}
  .btn:disabled{filter:grayscale(.65) opacity(.55);cursor:not-allowed;animation:none;transform:none}

  /* 提示条 */
  .toast{
    position:absolute;left:50%;bottom:64px;transform:translate(-50%,14px);
    background:rgba(38,52,63,.92);color:#fff;font-weight:800;font-size:15px;
    padding:10px 20px;border-radius:16px;opacity:0;pointer-events:none;
    transition:opacity .22s, transform .22s;z-index:9;box-shadow:0 10px 24px rgba(0,0,0,.22);
    white-space:nowrap;max-width:92%;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* 胜利遮罩 */
  .overlay{
    position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(28,48,64,.34);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:20px;
  }
  .overlay.show{display:grid}
  .win-card{
    width:min(400px,100%);background:#fff;border-radius:32px;padding:26px 22px 22px;text-align:center;
    box-shadow:0 28px 60px rgba(20,50,80,.28);animation:card-in .38s cubic-bezier(.2,1.4,.4,1);
    position:relative;overflow:hidden;
  }
  @keyframes card-in{from{transform:scale(.82) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .win-card .rays{position:absolute;inset:-60% -10% auto;height:220px;background:radial-gradient(closest-side,rgba(255,214,102,.55),rgba(255,214,102,0) 70%);pointer-events:none}
  .win-title{font-size:26px;font-weight:900;color:#2b9a3f;margin:0 0 4px;position:relative}
  .win-sub{font-size:14px;color:#7b8f9e;font-weight:700;margin:0 0 14px;position:relative}
  .stars{display:flex;justify-content:center;gap:10px;margin-bottom:6px;position:relative}
  .stars svg{width:52px;height:52px;filter:drop-shadow(0 6px 10px rgba(245,185,30,.4))}
  .stars .on{animation:star-pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
  .stars .on:nth-child(1){animation-delay:.1s}
  .stars .on:nth-child(2){animation-delay:.26s}
  .stars .on:nth-child(3){animation-delay:.42s}
  @keyframes star-pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
  .win-used{font-size:14px;font-weight:800;color:#8fa3b2;margin:8px 0 18px;position:relative}
  .win-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
  .win-btns .btn{font-size:16px;padding:15px 8px}
  .btn.blue{background:linear-gradient(160deg,#66b3ff,var(--blue))}
  .btn.blue2{background:linear-gradient(160deg,#dfeaf4,#c9dbe9);color:#4b6a80}

  /* 星星撒花 */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:41;overflow:hidden}
  .confetti i{position:absolute;width:10px;height:14px;border-radius:3px;opacity:0;animation:fall 2.1s ease-in forwards}
  @keyframes fall{
    0%{opacity:1;transform:translateY(-10vh) rotate(0)}
    100%{opacity:0;transform:translateY(105vh) rotate(680deg)}
  }

  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    .app{padding:12px 12px 20px}
    .brand{font-size:18px}
    .brand .logo{width:36px;height:36px}
    .dots{gap:5px;order:3;width:100%;margin-left:0}
    .dot{width:26px;height:26px;font-size:12px;border-radius:9px}
    .pbtn svg{width:26px;height:26px}
    .program{max-height:170px;min-height:110px}
  }
</style>
</head>
<body>
<div class="bg-deco"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 21.6c-1.7 0-3-1.1-3-2.4 0-.6.2-1.2.5-1.8L12 13l2.5 4.4c.3.6.5 1.2.5 1.8 0 1.3-1.3 2.4-3 2.4Z" fill="#fff"/>
          <path d="M12 13V4.2" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M11.8 6.4C13.4 6.4 15 5.3 15 3.8c0-1.4-1.7-1.6-3.2-.4C10.4 2.2 8.7 2.4 8.7 3.8c0 1.5 1.6 2.6 3.1 2.6Z" fill="#eafff0"/>
        </svg>
      </div>
      <span>小兔子采萝卜</span>
    </div>
    <div class="dots" id="dots"></div>
    <button class="icon-btn" id="muteBtn" title="声音开关">
      <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/></svg>
    </button>
  </div>

  <div class="layout">
    <!-- 游戏区 -->
    <section class="stage card">
      <div class="stage-head">
        <div class="lv-badge" id="lvBadge">第 1 关</div>
        <div class="lv-tip" id="lvTip">点蓝色箭头，让小兔子往前走</div>
      </div>
      <div class="board-holder" id="holder">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="stage-foot">
        <div class="cnt" id="cnt">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21c-1.6 0-2.8-1-2.8-2.2 0-.6.2-1.1.5-1.7L12 13l2.3 4.1c.3.6.5 1.1.5 1.7 0 1.2-1.2 2.2-2.8 2.2Z" fill="#ff8a3d"/><path d="M12 13V4" stroke="#ff8a3d" stroke-width="2" stroke-linecap="round"/><path d="M12 6c1.6 0 3-1 3-2.4C15 2.2 13.4 2 12 3c-1.4-1-3-.8-3 .6C9 5 10.4 6 12 6Z" fill="#4fc93a"/></svg>
          <b id="cntNum">0</b><span>/</span><span id="cntAll">1</span>
        </div>
        <div class="cnt" id="blockCnt" style="background:#eef6ff;color:#3d7ec0">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2.6" fill="#3b82f6"/><rect x="13" y="3" width="8" height="8" rx="2.6" fill="#8b5cf6"/><rect x="3" y="13" width="8" height="8" rx="2.6" fill="#f59e0b"/><rect x="13" y="13" width="8" height="8" rx="2.6" fill="#37b24d"/></svg>
          <b id="blkNum">0</b><span>/</span><span id="blkAll">10</span>
        </div>
        <div class="foot-note" id="footNote">点一下积木可以删掉它</div>
      </div>
      <div class="toast" id="toast"></div>
    </section>

    <!-- 指令区 -->
    <aside class="panel card">
      <div class="sec"><span class="num">1</span>给小兔子排路线<span class="right" id="usedLbl"></span></div>
      <div class="program" id="program"></div>

      <div class="sec" style="margin-top:2px"><span class="num">2</span>点指令，加进去</div>
      <div class="palette" id="palette"></div>

      <div class="actions">
        <button class="btn run" id="runBtn">开始</button>
        <button class="btn ghost" id="undoBtn">撤销</button>
        <button class="btn ghost" id="clearBtn">清空</button>
      </div>
    </aside>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <div class="rays"></div>
    <h2 class="win-title" id="winTitle">太棒了！</h2>
    <p class="win-sub" id="winSub">小兔子吃到萝卜啦</p>
    <div class="stars" id="stars"></div>
    <p class="win-used" id="winUsed"></p>
    <div class="win-btns">
      <button class="btn blue2" id="againBtn">再玩一次</button>
      <button class="btn blue" id="nextBtn">下一关</button>
    </div>
  </div>
</div>

<script>
/* ============ 音效 ============ */
let actx = null, muted = false;
function ac(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur=.12, type='sine', vol=.12, delay=0, slideTo=null){
  if(muted) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .02);
}
const SFX = {
  add(){ tone(660,.07,'square',.07); tone(990,.07,'square',.05,.05); },
  del(){ tone(420,.07,'triangle',.07,0,280); },
  turn(){ tone(520,.09,'triangle',.09,0,660); },
  step(){ tone(300,.06,'sine',.09); tone(380,.05,'sine',.05,.05); },
  jump(){ tone(520,.12,'sine',.1,0,900); },
  collect(){ tone(880,.09,'sine',.12); tone(1320,.1,'sine',.1,.09); tone(1760,.12,'sine',.07,.18); },
  bump(){ tone(160,.16,'sawtooth',.09,0,90); },
  fail(){ tone(300,.14,'sawtooth',.07,0,200); tone(200,.2,'sawtooth',.06,.12,120); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,.18,'sine',.11,i*.11)); [523,784].forEach((f,i)=>tone(f,.5,'triangle',.05,.46+i*.02)); },
  tap(){ tone(760,.05,'square',.05); }
};

/* ============ 关卡数据 ============ */
const DIRS = [[-1,0],[0,1],[1,0],[0,-1]];     // 上 右 下 左
const DIRNAME = {up:0,right:1,down:2,left:3};
const CELL = 100;

const LEVELS = [
  { name:'一直往前走', tip:'点蓝色箭头，再点「开始」', dir:'right', best:4,
    map:['.....','S.C.H','.....'] },
  { name:'学会转弯', tip:'走到路口要左转或右转哦', dir:'right', best:6,
    map:['.....','....H','S.C..'] },

/* ============ 状态 ============ */
const $ = s => document.querySelector(s);
const svg = $('#board');
const holder = $('#holder');
let lvIndex = 0, level = null, grid = [], rows = 0, cols = 0;
let start = {r:0,c:0}, home = {r:0,c:0}, totalCarrots = 0, collected = 0;
let bunny = {r:0,c:0,d:1};
let program = [];
let running = false, runToken = 0;
let carrotEls = new Map();
let bunnyPos = null, bunnyRot = null;
let progress = { unlocked:0, stars:{} };

const KEY = 'bunny-code-progress-v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) progress = Object.assign({unlocked:0,stars:{}}, JSON.parse(raw));
  }catch(e){}
  try{ muted = localStorage.getItem(KEY+'-mute') === '1'; }catch(e){}
}
function saveProgress(){
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){}
}

  if(kind === 'left') return `<svg viewBox="0 0 24 24" ${s}><path d="M17.5 21v-9a4.5 4.5 0 0 0-4.5-4.5H4.5"/><path d="M9 3 4 7.5 9 12"/></svg>`;

const STAR_SVG = on => `<svg viewBox="0 0 24 24" fill="${on?'#ffc83d':'#dde7ef'}"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9L12 2.6Z" stroke="${on?'#e9a900':'#cddae5'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

function buildBoard(){
  const W = cols * CELL, H = rows * CELL;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ar = W / H;
  holder.style.aspectRatio = `${W} / ${H}`;
  fitBoard();
  let s = '';
  s += `<rect x="0" y="0" width="${W}" height="${H}" rx="26" fill="#7fc44a"/>`;
  // 草地纹理
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x = c*CELL, y = r*CELL;
      const alt = (r+c) % 2 === 0;
      s += `<rect x="${x+4}" y="${y+4}" width="${CELL-8}" height="${CELL-8}" rx="18" fill="${alt?'#a9dd72':'#9fd769'}"/>`;
      s += `<rect x="${x+4}" y="${y+4}" width="${CELL-8}" height="${CELL-8}" rx="18" fill="url(#tileShine)"/>`;
      // 草地小装饰
      const deco = (r*7 + c*11) % 7;
      const empty = grid[r][c] === '.' || grid[r][c] === 'S';
      if(empty && deco === 0){
        s += `<g transform="translate(${x+22},${y+24})" opacity=".85">
          <circle r="4" fill="#fff"/><circle r="4" cx="6" cy="3" fill="#fff"/><circle r="4" cx="3" cy="8" fill="#fff"/><circle r="4" cx="-3" cy="6" fill="#fff"/>
          <circle r="2.4" cx="1.5" cy="4" fill="#ffd166"/></g>`;
      }else if(empty && deco === 3){
        s += `<g transform="translate(${x+76},${y+74})" opacity=".5">
          <path d="M0 0q-1-8-4-11M0 0q1-9 5-12M0 0q-4-5-9-6" stroke="#6cb83f" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>`;
      }
    }
  }
  s = `<defs>
      <linearGradient id="tileShine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
        <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
    </defs>` + s;

  carrotEls = new Map();
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const ch = grid[r][c];
      const cx = c*CELL + CELL/2, cy = r*CELL + CELL/2;
      if(ch === '#') s += `<g transform="translate(${cx},${cy})">${rockSVG()}</g>`;
      else if(ch === 'H') s += `<g class="house-wrap" transform="translate(${cx},${cy - 4})">${houseSVG(collected === totalCarrots)}</g>`;
      else if(ch === 'C') s += `<g class="carrot-wrap" transform="translate(${cx},${cy - 6})">${carrotSVG()}</g>`;
    }
  }
  s += `<g id="bunnyWrap">${makeBunny()}</g>`;
  svg.innerHTML = s;
  bunnyPos = svg.querySelector('#bunnyPos');
  bunnyRot = svg.querySelector('#bunnyRot');
  placeBunny(false);
}

function fitBoard(){
  const ar = (cols * CELL) / (rows * CELL);
  const maxH = Math.min(window.innerHeight * 0.56, 560);
  const availW = Math.max(240, holder.parentElement.clientWidth - 36);
  const w = Math.min(availW, maxH * ar);
  holder.style.width = w + 'px';
}

function placeBunny(animate, dur){
  if(!bunnyPos) return;
  const x = bunny.c*CELL + CELL/2;
  const y = bunny.r*CELL + CELL/2;
  const tx = `translate(${x}px, ${y}px)`;
  const rt = `rotate(${bunny.d*90}deg)`;
  if(!animate){
    bunnyPos.style.transition = 'none';
    bunnyRot.style.transition = 'none';
    bunnyPos.style.transform = tx;
    bunnyRot.style.transform = rt;
    void bunnyPos.getBoundingClientRect();
    requestAnimationFrame(()=>{
      bunnyPos.style.transition = '';
      bunnyRot.style.transition = '';
    });
    return;
  }
  bunnyPos.style.transition = dur ? `transform ${dur}ms cubic-bezier(.34,1.25,.5,1)` : '';
  bunnyRot.style.transition = '';
  bunnyPos.style.transform = tx;
  bunnyRot.style.transform = rt;
}

/* ============ 交互 ============ */
function walkable(r,c){
  return r >= 0 && c >= 0 && r < rows && c < cols && grid[r][c] !== '#';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function currentMax(){ return level.max || Math.max(level.best + 6, 8); }

function setLevel(i){
  lvIndex = Math.max(0, Math.min(LEVELS.length-1, i));
  const raw = LEVELS[lvIndex];
  level = Object.assign({}, raw);
  level.max = Math.max(level.best + 6, 8);
  grid = raw.map.map(row => row.split(''));
  rows = grid.length; cols = grid[0].length;
  totalCarrots = 0; collected = 0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(grid[r][c] === 'C') totalCarrots++;
    if(grid[r][c] === 'S') start = {r,c};
    if(grid[r][c] === 'H') home = {r,c};
  }
  bunny = {r:start.r, c:start.c, d:DIRNAME[raw.dir]};
  program = [];
  running = false; runToken++;
  $('#lvBadge').textContent = `第 ${lvIndex+1} 关`;
  $('#lvTip').textContent = raw.tip;
  $('#cntAll').textContent = totalCarrots;
  $('#cntNum').textContent = 0;
  $('#cnt').classList.remove('all');
  $('#blkAll').textContent = level.max;
  $('#blkNum').textContent = 0;
  renderDots();
  buildBoard();
  renderProgram();
  renderPalette();
  updateButtons();
}

function renderDots(){
  const box = $('#dots');
  box.innerHTML = LEVELS.map((l,i)=>{
    let cls = 'dot';
    if(i > progress.unlocked) cls += ' lock';
    else if(i < progress.unlocked) cls += ' done';
    if(i === lvIndex) cls += ' cur';
    return `<button class="${cls}" data-i="${i}">${i+1}</button>`;
  }).join('');
  box.querySelectorAll('.dot').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = +b.dataset.i;
      if(i > progress.unlocked){ SFX.bump(); toast('先过完前面的关卡哦'); return; }
      SFX.tap(); setLevel(i);
    });
  });
}

const KIND = { M:'move', J:'jump', L:'turn', R:'turn' };
const LABEL = { M:'前进', J:'跳跃', L:'左转', R:'右转' };

function renderPalette(){
  const list = [['M','move','前进'],['L','turn','左转'],['R','turn','右转']];
  if(level.jump) list.push(['J','jump','跳跃']);
  const p = $('#palette');
  p.style.gridTemplateColumns = `repeat(${list.length},1fr)`;
  p.innerHTML = list.map(([cmd,kind,label])=>
    `<button class="pbtn ${kind}" data-cmd="${cmd}">${icon(cmd==='M'?'move':cmd==='J'?'jump':cmd==='L'?'left':'right')}<span>${label}</span></button>`
  ).join('');
  p.querySelectorAll('.pbtn').forEach(b=>{
    b.addEventListener('click', ()=> addCmd(b.dataset.cmd));
  });
}

function addCmd(cmd){
  if(running) return;
  if(program.length >= currentMax()){ toast('积木用完啦，删掉一块再加吧'); SFX.bump(); return; }
  program.push(cmd);
  SFX.add();
  renderProgram();
  updateButtons();
  // 自动滚到底
  const pr = $('#program'); pr.scrollTop = pr.scrollHeight;
}

function renderProgram(){
  const pr = $('#program');
  pr.innerHTML = '';
  pr.classList.toggle('filled', program.length > 0);
  if(program.length === 0){
    pr.innerHTML = `<div class="empty-hint">
      <div class="bob">${icon('move').replace('<svg','<svg style="width:38px;height:38px;color:#b9d3e6"')}</div>
      <div>先点下面的按钮<br>把积木放进这里</div>
    </div>`;
  }else{
    program.forEach((cmd, i)=>{
      const b = document.createElement('button');
      b.className = 'blk ' + KIND[cmd];
      b.dataset.i = i;
      b.innerHTML = `<span class="i">${i+1}</span>${icon(cmd==='M'?'move':cmd==='J'?'jump':cmd==='L'?'left':'right')}`;
      b.addEventListener('click', ()=>{
        if(running) return;
        program.splice(i,1);
        SFX.del();
        renderProgram();
        updateButtons();
      });
      pr.appendChild(b);
    });
  }
  $('#blkNum').textContent = program.length;
  $('#blkAll').textContent = currentMax();
  const left = currentMax() - program.length;
  $('#usedLbl').textContent = `已用 ${program.length} / ${currentMax()}`;
  // 按钮可用性
  const full = program.length >= currentMax();
  document.querySelectorAll('.pbtn').forEach(b=> b.disabled = full || running);
}

function updateButtons(){
  const runBtn = $('#runBtn');
  runBtn.disabled = program.length === 0 || running;
  runBtn.classList.toggle('pulse', program.length > 0 && !running);
  $('#undoBtn').disabled = program.length === 0 || running;
  $('#clearBtn').disabled = program.length === 0 || running;
  document.querySelectorAll('.pbtn').forEach(b=> b.disabled = running || program.length >= currentMax());
  runBtn.textContent = running ? '跑起来…' : '开始';
}

function highlight(i){
  document.querySelectorAll('.blk').forEach((b,bi)=>{
    b.classList.toggle('active', bi === i);
  });
}

/* ============ 运行 ============ */
function bumpAnim(){
  if(!bunnyPos) return;
  bunnyPos.style.transition = 'transform .1s';
  const x = bunny.c*CELL + CELL/2, y = bunny.r*CELL + CELL/2;
  const [dr,dc] = DIRS[bunny.d];
  bunnyPos.style.transform = `translate(${x + dc*9}px, ${y + dr*9}px)`;
  setTimeout(()=>{
    bunnyPos.style.transition = '';
    bunnyPos.style.transform = `translate(${x}px, ${y}px)`;
  },110);
}

async function doCommand(cmd){
  if(cmd === 'L' || cmd === 'R'){
    bunny.d = cmd === 'L' ? (bunny.d + 3) % 4 : (bunny.d + 1) % 4;
    SFX.turn();
    placeBunny(true, 280);
    await sleep(290);
    return 'ok';
  }
  const steps = cmd === 'J' ? 2 : 1;
  const [dr,dc] = DIRS[bunny.d];
  const nr = bunny.r + dr*steps, nc = bunny.c + dc*steps;
  if(!walkable(nr,nc)){
    bumpAnim(); SFX.bump();
    await sleep(200); SFX.fail();
    toast(steps === 2 ? '前面跳不过去哦～' : '前面过不去啦！');
    return 'fail';
  }
  if(cmd === 'J') SFX.jump(); else SFX.step();
  bunny.r = nr; bunny.c = nc;
  placeBunny(true, cmd === 'J' ? 450 : 330);
  await sleep(cmd === 'J' ? 470 : 340);

  // 吃萝卜
  if(grid[nr][nc] === 'C'){
    grid[nr][nc] = '.';
    collected++;
    $('#cntNum').textContent = collected;
    if(collected === totalCarrots){
      $('#cnt').classList.add('all');
      const hw = svg.querySelector('.house-wrap');
      if(hw) hw.innerHTML = houseSVG(true);
    }
    const targetX = nc*CELL + CELL/2, targetY = nr*CELL + CELL/2 - 6;
    [...svg.querySelectorAll('.carrot-wrap')].forEach(el=>{
      const m = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/.exec(el.getAttribute('transform') || '');
      if(m && Math.abs(+m[1] - targetX) < 1.5 && Math.abs(+m[2] - targetY) < 1.5){
        const c = el.querySelector('.carrot');
        if(c) c.classList.add('eaten');
        setTimeout(()=> el.remove(), 430);
      }
    });
    SFX.collect();
    await sleep(180);
  }

  if(nr === home.r && nc === home.c){
    if(collected === totalCarrots) return 'win';
    toast('先把萝卜吃完，门才开哦');
    return 'hint';
  }
  return 'ok';
}

async function run(){
  if(running || program.length === 0) return;
  ac();
  running = true;
  const token = ++runToken;
  updateButtons();
  // 重置到起点
  setBoardReset();
  await sleep(200);
  let result = 'ok';
  for(let i=0;i<program.length;i++){
    if(token !== runToken) return;
    highlight(i);
    result = await doCommand(program[i]);
    if(result !== 'ok' && result !== 'hint') break;
    if(result === 'hint' && i < program.length - 1) result = 'ok';
  }
  highlight(-1);
  if(token !== runToken) return;
  running = false;
  updateButtons();
  if(result === 'win'){ win(); }
  else if(result === 'ok'){
    toast('还没到家，再想想路线吧～');
    SFX.tap();
  }
}

function setBoardReset(){
  collected = 0;
  bunny = {r:start.r, c:start.c, d:DIRNAME[level.dir]};
  $('#cntNum').textContent = 0;
  $('#cnt').classList.remove('all');
  // 恢复萝卜与小屋
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(LEVELS[lvIndex].map[r][c] === 'C') grid[r][c] = 'C';
  }
  buildBoard();
}

/* ============ 胜负 ============ */
function calcStars(){
  const used = program.length;
  if(used <= level.best + 1) return 3;
  if(used <= level.best + 3) return 2;
  return 1;
}

function win(){
  const st = calcStars();
  const prev = progress.stars[lvIndex] || 0;
  progress.stars[lvIndex] = Math.max(prev, st);
  progress.unlocked = Math.max(progress.unlocked, Math.min(lvIndex + 1, LEVELS.length - 1));
  saveProgress();
  renderDots();
  SFX.win();
  $('#winTitle').textContent = lvIndex === LEVELS.length - 1 ? '通关啦！' : '太棒了！';
  $('#winSub').textContent = lvIndex === LEVELS.length - 1 ? '你带小兔子走完了全部关卡' : '小兔子吃到萝卜，回家啦';
  $('#stars').innerHTML = [0,1,2].map(i=>`<span class="${i<st?'on':''}">${STAR_SVG(i<st)}</span>`).join('');
  $('#winUsed').textContent = `用了 ${program.length} 块积木 · 最少只要 ${level.best} 块哦`;
  $('#nextBtn').style.display = lvIndex === LEVELS.length - 1 ? 'none' : '';
  $('#overlay').classList.add('show');
  confetti();
}

function confetti(){
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#ff8a3d','#ffd166','#4ad07a','#5bb8f5','#b39bff','#ff6f9c'];
  for(let i=0;i<34;i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + 'vw';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random()*0.5) + 's';
    s.style.animationDuration = (1.5 + Math.random()) + 's';
    s.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=> box.remove(), 2800);
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1900);
}

/* ============ 事件绑定 ============ */
$('#runBtn').addEventListener('click', run);
$('#undoBtn').addEventListener('click', ()=>{
  if(running || !program.length) return;
  program.pop(); SFX.del(); renderProgram(); updateButtons();
});
$('#clearBtn').addEventListener('click', ()=>{
  if(running) return;
  program = []; SFX.del(); renderProgram(); updateButtons();
});
$('#againBtn').addEventListener('click', ()=>{
  $('#overlay').classList.remove('show');
  program = []; renderProgram(); updateButtons();
  setBoardReset();
  SFX.tap();
});
$('#nextBtn').addEventListener('click', ()=>{
  $('#overlay').classList.remove('show');
  setLevel(lvIndex + 1);
  SFX.tap();
});
$('#overlay').addEventListener('click', e=>{
  if(e.target === $('#overlay')) $('#overlay').classList.remove('show');
});
$('#muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  try{ localStorage.setItem(KEY+'-mute', muted?'1':'0'); }catch(e){}
  updateMuteIcon();
  if(!muted) SFX.tap();
});
function updateMuteIcon(){
  $('#muteBtn').classList.toggle('muted', muted);
  $('#soundOn').innerHTML = muted
    ? `<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9l5 6M21 9l-5 6"/>`
    : `<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6.5a8 8 0 0 1 0 11"/>`;
}
window.addEventListener('resize', ()=>{ fitBoard(); });
window.addEventListener('keydown', e=>{
  if(e.key === 'Enter') run();
  if(e.key === 'Backspace'){ e.preventDefault(); $('#undoBtn').click(); }
});

/* ============ 启动 ============ */
loadProgress();
updateMuteIcon();
setLevel(Math.min(progress.unlocked, LEVELS.length - 1));
</script>
</body>
</html>
